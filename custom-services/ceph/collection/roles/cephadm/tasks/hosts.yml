---
# Register this nodeset's hosts with the cluster (all modes).

- name: Add all hosts to the Ceph cluster
  # Registered under their FQDNs: cephadm check-host compares the
  # registered name against `hostname -f` (the operator provides the
  # FQDN as the canonical_hostname hostvar). Each host gets its
  # effective labels (per-node xedpm_ceph_host_labels or the global
  # value); set_admin_label keeps the '_admin' label bootstrap
  # applied to the bootstrap host. The module reconciles label
  # changes with label add/rm, so re-running with different labels is
  # safe.
  run_once: true
  delegate_to: "{{ _ceph_admin_host }}"
  become: true
  ceph.cephadm.ceph_orch_host:
    name: "{{ hostvars[item].canonical_hostname }}"
    address: "{{ hostvars[item][_ceph_public_net_prefix ~ '_ip'] }}"
    labels: "{{ _ceph_host_labels[item] }}"
    set_admin_label: true
    image: "{{ xedpm_ceph_container_image }}"
  loop: "{{ _ceph_play_hosts }}"
