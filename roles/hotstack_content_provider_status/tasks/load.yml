# Load the vars file written by an earlier run of this role (possibly
# in an earlier zuul playbook) as facts for consuming tasks. The file
# lives on the remote host, so include_vars cannot read it from the
# controller; slurp it and set the facts here.

- name: Slurp the content provider status vars file
  ansible.builtin.slurp:
    src: "{{ hotstack_content_provider_status_vars_file }}"
  register: _cp_vars_file_raw

- name: Load the content provider status vars
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _cp_vars_file_raw.content | b64decode | from_yaml | dict2items }}"
