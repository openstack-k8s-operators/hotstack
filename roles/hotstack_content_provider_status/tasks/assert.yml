- name: Require the content provider role variables
  ansible.builtin.assert:
    that:
      - hotstack_content_provider_status_job_name | length > 0
      - hotstack_content_provider_status_zuul_web_url | length > 0
    fail_msg: >-
      Set hotstack_content_provider_status_job_name (the content provider
      job to discover) and hotstack_content_provider_status_zuul_web_url
      (the zuul web base URL, which zuul does not expose to jobs), e.g.
      in the zuul job vars.

- name: Require the zuul job context
  ansible.builtin.assert:
    that:
      - zuul.tenant is defined and zuul.tenant | length > 0
      - zuul.pipeline is defined and zuul.pipeline | length > 0
      - zuul.change is defined and zuul.change | string | length > 0
      - zuul.patchset is defined and zuul.patchset | string | length > 0
    fail_msg: >-
      This role requires a zuul job context with a change trigger
      (zuul.tenant, zuul.pipeline, zuul.change, zuul.patchset): it
      discovers content providers in the same buildset and pipeline as
      the calling job.
