- name: Wait for the content provider to pause or complete
  hotstack_get_content_provider_build:
    zuul_web_url: "{{ hotstack_content_provider_status_zuul_web_url }}"
    tenant: "{{ zuul.tenant }}"
    pipeline: "{{ zuul.pipeline }}"
    change: "{{ zuul.change }}"
    patchset: "{{ zuul.patchset }}"
    job_name: "{{ hotstack_content_provider_status_job_name }}"
    wait_for: paused
    timeout: "{{ hotstack_content_provider_status_pause_timeout }}"
    poll_delay: "{{ hotstack_content_provider_status_poll_delay }}"
  register: _cp_build_state

- name: Fail fast when the content provider completed without pausing
  when: not _cp_build_state.paused
  ansible.builtin.fail:
    msg: >-
      Content provider job {{ hotstack_content_provider_status_job_name }} finished
      with result {{ _cp_build_state.result | default('UNKNOWN') }} without
      pausing for this job: its registry and status page are already torn
      down. See {{ _cp_build_state.report_url | default('the Zuul build page') }}
      for details.
