# Discover the status page of a content provider job that runs in
# parallel with this job and write the published content to a vars file.

- name: Validate the content provider discovery inputs
  ansible.builtin.import_tasks: assert.yml

- name: Find the content provider job in the buildset pipeline
  ansible.builtin.import_tasks: discover.yml

- name: Scrape the provider console stream for the status URL marker
  ansible.builtin.import_tasks: scrape.yml

- name: Wait for the content provider to pause
  ansible.builtin.import_tasks: wait_for_paused.yml

- name: Fetch the status document and write the vars file
  ansible.builtin.import_tasks: fetch.yml

- name: Load the content provider status vars
  ansible.builtin.import_tasks: load.yml
