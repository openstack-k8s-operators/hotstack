- name: Assert
  ansible.builtin.assert:
    that:
      - ca.name | default('') | length > 0
      - ca.url | default('') | length > 0 or ca.data | default('') | length > 0

- name: Download the CA bundle if url
  no_log: true
  when: ca.url | default('') | length > 0
  ignore_errors: true
  ansible.builtin.uri:
    url: "{{ ca.url }}"
    method: get
    return_content: true
    validate_certs: false
  register: __get_ca_from_url_result


- name: Append to _ocp_additional_trusted_ca_map
  no_log: true
  when: (
          ca.data | default('') | length > 0 or
          (
            ca.url | default('') | length > 0 and
            not __get_ca_from_url_result.failed
          )
        )
  ansible.builtin.set_fact:
    _ocp_additional_trusted_ca_map: >-
      {{
        _ocp_additional_trusted_ca_map |
        combine(
          {ca.name: ca.data | default(__get_ca_from_url_result.content)}
        )
      }}
