# Base URL to the published CI files, i.e. the directory that contains
# the 'index', 'bundle' and 'proxy.yaml' files. When set, the role fetches
# these files and generates a vars file from them, see
# 'hot_ci_files_dest'. The role is a no-op when this is not set.
# Example:
#   hot_ci_files_url: >-
#     https://<host>/xyz/xyz-CI-files/latest
hot_ci_files_url: ''

# Path of the generated vars file. Include this file as the last
# -e @<file> when running the hotstack scenario playbooks, i.e. after the
# scenario bootstrap_vars.yml, so that the generated values override the
# scenario defaults.
hot_ci_files_dest: ci-files-vars.yaml

# Mark the locations and mirrors of the derived EDPM podman registries
# as insecure.
hot_ci_files_edpm_insecure: true

# Validate the TLS certificates of the CI files server.
hot_ci_files_validate_certs: true
