# Ansible configuration for the hotstack repository.
#
# Scenario stacks create nodes with identical connection identities
# (same user and address, e.g. stack@192.168.32.20), reached through
# a stack-specific ProxyJump controller. Ansible's default control
# path hash does not include the jump host, so plays targeting
# different stacks (run in parallel, or within the 60s
# ControlPersist window) would multiplex over a single SSH master
# connection and act against the same node.
#
# %C is OpenSSH's hash of all connection parameters, including the
# ProxyJump host, which gives each stack its own control socket.
[ssh_connection]
control_path = %(directory)s/ansible-ssh-%%C
