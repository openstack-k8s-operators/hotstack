# Netfilter match modules required by the cEOS container.
#
# cEOS programs its control-plane ACLs as iptables rules inside the
# container's network namespace. The iptables match extensions are host
# kernel modules. If they are not loaded when the cEOS container boots,
# rule installation inside the container fails ("Extension tcp revision
# 0 not supported, missing kernel module?") and the INPUT/FORWARD/OUTPUT
# chains keep their DROP policy, silently dropping all IPv4 traffic to
# and from the switch.
#
# On CentOS 10 Stream nothing on the minimal guest image loads these
# modules, so load them explicitly at boot. Extend this list if the
# container logs warnings about other missing iptables extensions.
xt_tcpudp
xt_conntrack
xt_multiport
xt_addrtype
xt_owner
