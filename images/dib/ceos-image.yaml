---
- imagename: ceos-switch-host.qcow2
  elements:
    - centos
    - vm
    - epel
    - growroot
    - block-device-efi
    - package-installs
    - hotstack-ceos
  environment:
    # CentOS 10 Stream (kernel 6.12) is incompatible with the cEOS 4.35
    # userspace: the EOS Acl agent fails to program its kernel ACL rules
    # (iptables-restore fails, iptables 1.8.8 nf_tables cannot translate
    # the rule matches), leaving empty chains with DROP policies that
    # silently drop all IPv4 traffic to and from the switch. Stay on
    # 9 Stream (kernel 5.14) until a cEOS release supporting newer
    # kernels is available.
    DIB_RELEASE: '9-stream'
    DIB_PYTHON_VERSION: '3'
    DIB_IMAGE_SIZE: '15'
    DIB_TIMEZONE: 'UTC'
    COMPRESS_IMAGE: '1'
    DIB_BOOTLOADER_DEFAULT_CMDLINE: 'nofb nomodeset gfxpayload=text net.ifnames=0'
    # DIB_CEOS_IMAGE set via Makefile (CEOS_TAR_IMAGE)
    DIB_BLOCK_DEVICE_CONFIG: |
      - local_loop:
          name: image0
      - partitioning:
          base: image0
          label: gpt
          partitions:
            - name: ESP
              type: 'EF00'
              size: 550MiB
              mkfs:
                type: vfat
                mount:
                  mount_point: /boot/efi
                  fstab:
                    options: "defaults"
                    fsck-passno: 2
            - name: BSP
              type: 'EF02'
              size: 8MiB
            - name: boot
              type: '8300'
              size: 512MiB
              mkfs:
                type: ext4
                mount:
                  mount_point: /boot
                  fstab:
                    options: "defaults"
                    fsck-passno: 1
            - name: root
              type: '8300'
              size: 100%
              mkfs:
                type: ext4
                mount:
                  mount_point: /
                  fstab:
                    options: "defaults"
                    fsck-passno: 1
