- name: Verify content provider status page consumption
  hosts: consumer
  gather_facts: false
  vars:
    hotstack_content_provider_status_vars_file: "{{ ansible_user_dir }}/hotstack/content-provider-status.yml"
  tasks:
    - name: Install the console stream module dependency
      become: true
      ansible.builtin.dnf:
        name: python3-websockets
        state: present

    - name: Discover and verify the content provider status page
      ansible.builtin.include_role:
        name: hotstack_content_provider_status

    # The role writes the published document to the vars file and loads
    # it as facts; verifying it is up to the consumer. The assertions
    # below check the status page contract of the s2i content provider.
    - name: Validate the content provider status document
      ansible.builtin.assert:
        that:
          - hotstack_content_provider_status_registry_ip_port is match('^[^:]+:[0-9]+$')
          - hotstack_content_provider_status_custom_container_images is mapping
          - hotstack_content_provider_status_custom_container_images | length > 0

    - name: Show the content provider status vars
      ansible.builtin.debug:
        msg:
          status_url: "{{ hotstack_content_provider_status_url }}"
          registry: "{{ hotstack_content_provider_status_registry_ip_port }}"
          registry_ip: "{{ hotstack_content_provider_status_registry_ip }}"
          custom_container_images: "{{ hotstack_content_provider_status_custom_container_images }}"
          build: "{{ hotstack_content_provider_status_build_url }}"
